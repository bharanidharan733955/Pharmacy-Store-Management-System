server.port=8080

spring.application.name=pharmacy-web

# Datasource configuration: defaults to H2 in-memory database with MySQL syntax mode.
# When MySQL credentials are provided via DB_URL / DB_USER / DB_PASSWORD, it connects to MySQL Server 8.0.
spring.datasource.url=${DB_URL:jdbc:h2:mem:pharmacydb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security
pharmacy.jwt.secret=PharmacyStoreManagementSystemSuperSecureKey20261012
pharmacy.jwt.expiration-ms=86400000

# Logging
logging.level.com.pharmacy=INFO
logging.level.org.springframework.security=WARN
